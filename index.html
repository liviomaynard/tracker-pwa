function createCase(){
  if(!draft||!draftReady()) return;
  var c={ id:uid(), process:draft.process, name:draft.name.trim(),
    inst:draft.inst, unit:draft.unit,
    start:draft.start, created:isoD(today()),
    notes:(draft.notes||"").trim(),
    col:S.columns[0].id, archived:false };
  flagsFor(draft.process).forEach(function(f){ c[f.k]=!!draft[f.k]; });
  c.steps=buildSteps(c);
  S.cases.push(c); draft=null; save();
  openCase=c.id; caseFrom="board"; view="case"; render();
  toast("Checklist built — "+c.steps.length+" steps");
}
function toggleStep(cid,sid){
  var c=S.cases.filter(function(x){return x.id===cid;})[0]; if(!c) return;
  var s=findStep(c,sid); if(!s) return;
  if(!s.done && isBlocked(c,s)) return;
  s.done=!s.done; s.doneAt=s.done?isoD(today()):null;
  var p=caseProgress(c);
  var dc=S.columns.filter(function(x){return /complet|done|finish/i.test(x.name);})[0];
  if(p.total && p.done===p.total && dc){ if(c.col!==dc.id) c.colWas=c.col; c.col=dc.id; }
  else if(!s.done && dc && c.col===dc.id && c.colWas){
    if(S.columns.some(function(x){return x.id===c.colWas;})) c.col=c.colWas;
    delete c.colWas;
  }
  save(); render();
}
function delStep(cid,sid){
  var c=S.cases.filter(function(x){return x.id===cid;})[0]; if(!c) return;
  var s=findStep(c,sid); if(!s) return;
  if(!confirm("Remove \""+s.t+"\" from "+c.name+"?")) return;
  c.steps=c.steps.filter(function(x){return x.id!==sid;});
  c.steps.forEach(function(x){ if(x.needs) x.needs=x.needs.filter(function(n){return n!==sid;}); });
  save(); render(); toast("Step removed");
}
function moveStep(cid,sid,dir){
  var c=S.cases.filter(function(x){return x.id===cid;})[0]; if(!c) return;
  var i=c.steps.findIndex(function(x){return x.id===sid;});
  var j=i+dir; if(i<0||j<0||j>=c.steps.length) return;
  var tmp=c.steps[i]; c.steps[i]=c.steps[j]; c.steps[j]=tmp;
  save(); render();
}
function syncCase(){
  var c=S.cases.filter(function(x){return x.id===openCase;})[0]; if(!c) return;
  var start=parseD(c.start), created=parseD(c.created)||today(), n=0;
  S.template.forEach(function(t){
    if(!appliesTo(t,c) || findStep(c,t.id)) return;
    c.steps.push({ id:t.id, t:t.t, d:t.d, owner:t.owner, phase:t.phase||null,
      needs:t.needs?t.needs.slice():null, due:isoD(computeDue(t,start,created)),
      done:false, doneAt:null, note:"" });
    n++;
  });
  save(); render(); toast(n+" step"+(n===1?"":"s")+" added");
}
function reflow(){
  var c=S.cases.filter(function(x){return x.id===openCase;})[0]; if(!c) return;
  if(!confirm("Recalculate every step's date from the start date? Notes and ticks are kept.")) return;
  var start=parseD(c.start), created=parseD(c.created)||today();
  c.steps.forEach(function(s){
    var t=S.template.filter(function(x){return x.id===s.id;})[0];
    if(t) s.due=isoD(computeDue(t,start,created));
  });
  save(); closeModal(); render(); toast("Dates recalculated");
}
function libDel(id){
  var s=S.template.filter(function(x){return x.id===id;})[0]; if(!s) return;
  if(!confirm("Delete \""+s.t+"\" from the library? Checklists already running keep their copy.")) return;
  S.template=S.template.filter(function(x){return x.id!==id;});
  S.template.forEach(function(x){ if(x.needs) x.needs=x.needs.filter(function(n){return n!==id;}); });
  save(); render(); toast("Deleted from the library");
}
function libMove(id,dir){
  var i=S.template.findIndex(function(x){return x.id===id;});
  if(i<0) return;
  var pid=stepProcess(S.template[i]), ph=S.template[i].phase||"";
  var j=i+dir;
  while(j>=0 && j<S.template.length &&
        (stepProcess(S.template[j])!==pid || (S.template[j].phase||"")!==ph)) j+=dir;
  if(j<0||j>=S.template.length) return;
  var t=S.template[i]; S.template[i]=S.template[j]; S.template[j]=t;
  save(); render();
}
function libReset(){
  if(!confirm("Replace the library with the original steps? Your edits and added steps will be lost. Goals you created yourself, and their steps, are kept. Checklists already running are not affected.")) return;
  var his=S.template.filter(function(x){ return !isBuiltin(stepProcess(x)); });
  S.template=JSON.parse(JSON.stringify(DEFAULT_STEPS)).concat(his);
  S.seededProcesses=PROCESSES.map(function(P){ return P.id; });
  save(); render(); toast("Library restored");
}
function recDel(id){
  var r=S.recurring.filter(function(x){return x.id===id;})[0]; if(!r) return;
  if(!confirm("Delete \""+r.t+"\"?")) return;
  S.recurring=S.recurring.filter(function(x){return x.id!==id;});
  save(); render();
}
function doneRecur(id){
  var r=S.recurring.filter(function(x){return x.id===id;})[0]; if(!r) return;
  var prev={next:r.next, anchor:r.anchor||null, lastDone:r.lastDone||null};
  r.lastDone=isoD(today());
  advance(r); logRecur(r,prev); save(); render(); toast("Next: "+fmtD(parseD(r.next)));
}
function addUnit(){
  var i=document.getElementById("newUnit"); if(!i) return;
  var v=i.value.trim(); if(!v) return;
  if(S.units.indexOf(v)!==-1){ toast("Already there"); return; }
  S.units.push(v); i.value=""; save(); render(); toast("Unit added");
}
function addGroup(){
  var i=document.getElementById("newGroup"); if(!i) return;
  var v=i.value.trim(); if(!v) return;
  if(v==="*"){ toast("Pick another name"); return; }
  if(S.groups.indexOf(v)!==-1){ toast("Already there"); return; }
  S.groups.push(v); i.value=""; save(); render(); toast("Category added");
}
function delGroup(g){
  var n=S.template.filter(function(x){return x.inst===g;}).length;
  if(!confirm("Remove the category \u201c"+g+"\u201d?"+
     (n?"\n\n"+n+" step"+(n>1?"s are":" is")+" limited to it and will apply to all categories instead.":"")+
     "\n\nCases already using it keep it.")) return;
  S.groups=S.groups.filter(function(x){return x!==g;});
  S.template.forEach(function(x){ if(x.inst===g) x.inst="*"; });
  save(); render();
}
function delUnit(u){
  if(!confirm("Remove "+u+" from the unit list? Checklists already using it keep it.")) return;
  S.units=S.units.filter(function(x){return x!==u;});
  save(); render();
}
function addCol(){
  var n=prompt("Column name:",""); if(!n||!n.trim()) return;
  S.columns.push({id:uid(),name:n.trim()}); save(); render();
}
function delCol(id){
  if(S.columns.length<=1) return;
  var inc=S.cases.filter(function(c){return c.col===id && isActive(c);});
  if(inc.length && !confirm(inc.length+" checklist(s) will move to the first column. Delete this column?")) return;
  var first=S.columns.filter(function(c){return c.id!==id;})[0];
  S.cases.forEach(function(c){ if(c.col===id) c.col=first.id; });
  S.columns=S.columns.filter(function(c){return c.id!==id;});
  save(); render();
}
var DEFAULT_CANCEL_REASONS = ["Plans changed","Not needed any more","Started it by mistake"];

function cancelCase(){
  var c=S.cases.filter(function(x){return x.id===openCase;})[0]; if(!c) return;
  var P=proc(caseProcess(c));
  var reasons=P.cancelReasons||DEFAULT_CANCEL_REASONS;
  var body='<div class="q"><label class="f">Why is it stopping?</label>'+
    '<input type="text" id="fWhy" placeholder="A few words is enough" value="">'+
    '<div class="opts" style="margin-top:9px">';
  reasons.forEach(function(r){
    body+='<button type="button" class="opt sm" data-act="cxr" data-v="'+esc(r)+'">'+esc(r)+'</button>';
  });
  body+='</div><div class="hint">The checklist stops immediately — its steps leave This week and the board. '+
    'Nothing is deleted, and you can reopen it from Backup if it starts up again.</div></div>';
  openModal("Cancel this checklist", c.name, body, function(){
    c.cancelled=true;
    c.cancelledAt=isoD(today());
    c.cancelReason=mv("fWhy").trim();
    save(); openCase=null; view="board"; render();
    toast("Cancelled — "+c.name);
    return true;
  }, null, {save:"Stop this checklist", close:"Never mind"});
}

function reopenCase(cid){
  var c=S.cases.filter(function(x){return x.id===cid;})[0]; if(!c) return;
  c.cancelled=false; c.cancelledAt=null; c.cancelReason="";
  save(); render(); toast("Reopened — "+c.name);
}

function archiveCase(){
  var c=S.cases.filter(function(x){return x.id===openCase;})[0]; if(!c) return;
  if(!confirm("Archive "+c.name+"? It stays in your data and can be restored from Backup.")) return;
  c.archived=true; save(); view="board"; render();
}
function delCase(cid){
  var c=S.cases.filter(function(x){return x.id===cid;})[0]; if(!c) return;
  if(!confirm("Permanently delete "+c.name+"? This cannot be undone.")) return;
  S.cases=S.cases.filter(function(x){return x.id!==cid;});
  save(); render();
}
function copyRow(){
  var c=S.cases.filter(function(x){return x.id===openCase;})[0]; if(!c) return;
  var p=caseProgress(c), nx=nextOpen(c);
  var row=[c.name,c.inst||"",c.unit||"",c.start,p.done+"/"+p.total,(nx?nx.t:"complete")].join("\t");
  var ta=document.createElement("textarea");
  ta.value=row; ta.style.position="fixed"; ta.style.opacity="0";
  document.body.appendChild(ta); ta.select();
  try{ document.execCommand("copy"); toast("Row copied \u2014 paste it into a spreadsheet"); }
  catch(x){ prompt("Copy this row:",row); }
  document.body.removeChild(ta);
}
/* Export: on a phone or tablet, hand the file to the share sheet (Save to Files, iCloud
   Drive, AirDrop...). Anywhere that cannot, or if sharing fails, download it as before. */
function backupInfo(){
  var snap=Object.assign({}, S, {lastExport:isoD(today()), lastSync:new Date().toISOString(),
    appVersion:APP_VERSION, appVersionDate:APP_VERSION_DATE});
  return {name:"tracker-backup-"+isoD(today())+".json", text:JSON.stringify(snap,null,2)};
}
function shareFile(info){
  try{
    if(!navigator.share || !navigator.canShare) return null;
    var touch=(window.matchMedia && matchMedia("(pointer:coarse)").matches) ||
      /iPhone|iPad|iPod|Android/.test(navigator.userAgent||"") ||
      (navigator.platform==="MacIntel" && navigator.maxTouchPoints>1);
    if(!touch) return null;
    var types=["application/json","text/plain"];
    for(var i=0;i<types.length;i++){
      var f=new File([info.text], info.name, {type:types[i]});
      if(navigator.canShare({files:[f]})) return f;
    }
  }catch(x){}
  return null;
}
function canShareFiles(){ return !!shareFile({name:"x.json", text:"{}"}); }
function downloadBackup(info){
  var blob=new Blob([info.text],{type:"application/json"});
  var a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download=info.name;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(function(){ URL.revokeObjectURL(a.href); },1000);
}
function markSynced(exported){
  S.lastSync=new Date().toISOString();
  if(exported){ S.lastExport=isoD(today()); S.appVersion=APP_VERSION; S.appVersionDate=APP_VERSION_DATE; }
  save();
}
function doExport(forceDownload){
  var info=backupInfo();
  var file=(forceDownload===true) ? null : shareFile(info);
  if(file){
    navigator.share({files:[file], title:"Tracker backup"})
      .then(function(){ markSynced(true); render(); toast("Backup saved — merge it on your other device"); })
      .catch(function(e){
        if(e && e.name==="AbortError"){ toast("Export cancelled — nothing was saved"); return; }
        downloadBackup(info); markSynced(true); render(); toast("Sharing did not work, so the backup was downloaded");
      });
    return;
  }
  downloadBackup(info); markSynced(true); render(); toast("Backup downloaded");
}
var PREMERGE_KEY=KEY+"_premerge";
function keepUndo(){ try{ localStorage.setItem(PREMERGE_KEY, JSON.stringify(S)); }catch(x){} }
function hasUndo(){ try{ return !!localStorage.getItem(PREMERGE_KEY); }catch(x){ return false; } }
function undoImport(){
  var raw; try{ raw=localStorage.getItem(PREMERGE_KEY); }catch(x){}
  if(!raw){ toast("Nothing to undo"); return; }
  if(!confirm("Put everything back the way it was before the last import? Changes made since then will be lost.")) return;
  var d; try{ d=JSON.parse(raw); }catch(x){ toast("The saved copy could not be read"); return; }
  d.rev=Math.max(d.rev||0,S.rev||0);
  S=d; load2(); save();
  try{ localStorage.removeItem(PREMERGE_KEY); }catch(x){}
  render(); toast("Import undone");
}
function syncSummary(r){
  var p=[];
  if(r.added) p.push(r.added+" new");
  if(r.updated) p.push(r.updated+" changed");
  if(r.removed) p.push(r.removed+" removed");
  var t="From the file: "+(p.join(", ")||"nothing new")+".";
  if(r.kept) t+="\nKept what is already here, because it is newer: "+r.kept+".";
  return t;
}
function doImport(e){
  var replace=e.target.id==="fileRep";
  var f=e.target.files&&e.target.files[0]; if(!f) return;
  var r=new FileReader();
  r.onload=function(){
    var d;
    try{ d=JSON.parse(r.result); if(!d||!d.cases) throw new Error("bad"); }
    catch(x){ alert("That file could not be read as a backup. Pick a file exported from this app."); return; }
    if(replace){
      if(!confirm("Replace everything currently in the app with this backup?")) return;
      keepUndo(); d.rev=Math.max(d.rev||0,S.rev||0);
      var mine={multiDevice:S.multiDevice, syncDays:S.syncDays, syncSnooze:S.syncSnooze};
      S=d; load2();
      Object.keys(mine).forEach(function(k){ if(mine[k]!==undefined) S[k]=mine[k]; });
      S.lastSync=new Date().toISOString();
      save(); render(); toast("Backup restored"); return;
    }
    var m;
    try{ m=syncMerge(S,d); }
    catch(x){ alert("The merge did not work, so nothing was changed.\n\n"+x.message); return; }
    var rp=m.report, total=rp.added+rp.updated+rp.removed;
    if(!m.changed){ markSynced(false); render(); toast("Already up to date — nothing to merge"); return; }
    if(total && !confirm("Merge this backup into what is on this device?\n\n"+syncSummary(rp)+"\n\nYou can undo it from Backup.")) return;
    keepUndo();
    S=m.merged; load2(); S.lastSync=new Date().toISOString(); save(); render();
    toast(total ? "Merged — "+syncSummary(rp).split("\n")[0].replace("From the file: ","") : "Already up to date");
  };
  r.readAsText(f); e.target.value="";
}
function load2(){
  var b=blankState();
  if(!S.units) S.units=b.units;
  if(!S.columns) S.columns=b.columns;
  if(!S.recurring) S.recurring=b.recurring;
  if(!S.template) S.template=b.template;
  if(!S.cases) S.cases=[];
  migrate();
  pruneDone();
  syncReset();
}

(function(){
  var bv=document.getElementById("brandVer");
  if(bv) bv.textContent="v"+APP_VERSION;
})();

/* ---- PWA: service worker, install prompt, update prompt, persistent storage ---- */
(function(){
  var bar=document.getElementById("pwaBar"), msg=document.getElementById("pwaMsg"),
      go=document.getElementById("pwaGo"), no=document.getElementById("pwaNo");
  var onGo=null;
  function lsGet(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
  function lsSet(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }
  function show(text,label,fn){ msg.textContent=text; go.textContent=label; go.style.display=fn?"":"none"; onGo=fn; bar.classList.add("on"); }
  function hide(){ bar.classList.remove("on"); }
  go.addEventListener("click",function(){ var f=onGo; hide(); if(f) f(); });
  no.addEventListener("click",function(){ hide(); lsSet("tracker_pwa_nag",String(Date.now())); });

  var standalone=(window.matchMedia&&matchMedia("(display-mode:standalone)").matches)||navigator.standalone===true;
  var ua=navigator.userAgent||"";
  var iOS=/iPhone|iPad|iPod/.test(ua)||(navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1);
  var nagged=Number(lsGet("tracker_pwa_nag")||0), quiet=Date.now()-nagged<14*864e5;

  // Ask the browser not to evict our storage. Quietly ignored where unsupported.
  if(navigator.storage&&navigator.storage.persist){ navigator.storage.persist().catch(function(){}); }

  // Install: Chrome / Edge give us an event; Safari has no event, so explain the menu.
  var deferred=null;
  window.addEventListener("beforeinstallprompt",function(e){
    e.preventDefault(); deferred=e;
    if(!standalone&&!quiet) show("Install Tracker as an app?","Install",function(){ deferred.prompt(); deferred=null; });
  });
  window.addEventListener("appinstalled",function(){ hide(); });
  if(!standalone&&!quiet&&iOS){
    setTimeout(function(){ show("To install: tap Share, then \u201cAdd to Home Screen\u201d. That also keeps iOS from clearing your data.","",null); },1500);
  }

  // Service worker (needs https or localhost; skipped when opened as a plain file)
  if("serviceWorker" in navigator && /^https?:$/.test(location.protocol)){
    var hadController=!!navigator.serviceWorker.controller;
    window.addEventListener("load",function(){
      navigator.serviceWorker.register("sw.js").then(function(reg){
        function offer(w){ show("A new version of Tracker is ready.","Update",function(){ w.postMessage("skipWaiting"); }); }
        if(reg.waiting&&navigator.serviceWorker.controller) offer(reg.waiting);
        reg.addEventListener("updatefound",function(){
          var w=reg.installing; if(!w) return;
          w.addEventListener("statechange",function(){
            if(w.state==="installed"&&navigator.serviceWorker.controller) offer(w);
          });
        });
        // check for a new version whenever the app comes back to the foreground
        document.addEventListener("visibilitychange",function(){ if(!document.hidden) reg.update().catch(function(){}); });
      }).catch(function(){});
      var reloaded=false;
      navigator.serviceWorker.addEventListener("controllerchange",function(){
        if(reloaded||!hadController) return; reloaded=true; location.reload();
      });
    });
  }
})();
</script>
