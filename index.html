<!DOCTYPE html>
<html lang="en">
<!--
  Tracker 1.3.0 (blank edition, built 2026-10-06 from 4.12.0)
  A single-file process tracker. Everything it knows about your work is
  what you put into it; nothing ships inside.
-->
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tracker</title>
<meta name="theme-color" content="#0B1116">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Tracker">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
:root{
  --ink:#F2F5F8; --ink-2:#B9C4CF; --paper:#0B1116; --surface:#131B24;
  --rule:rgba(255,255,255,.075); --rule-soft:rgba(255,255,255,.045); --muted:#8B96A3;
  --g0:#8FB3F5; --g1:#3BC4B0; --overdue:#FF7C5C; --soon:#E0A93D;
  --done:#4BC88E; --carried:#B8A4F0; --focus:#8FD6FF;
  --glass:rgba(17,23,32,.55); --glass-soft:rgba(255,255,255,.05);
  --accent:#8FD6FF;

  --r-xs:9px; --r-sm:13px; --r-md:18px; --r-lg:24px; --r-pill:999px;

  --spec:inset 0 1px 0 rgba(255,255,255,.11);
  --lift:0 14px 34px -12px rgba(0,0,0,.62);
  --lift-sm:0 8px 20px -10px rgba(0,0,0,.55);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{background:
    radial-gradient(760px 420px at 8% -6%, rgba(143,214,255,.10), transparent 60%),
    radial-gradient(680px 380px at 96% 104%, rgba(59,196,176,.09), transparent 58%),
    radial-gradient(520px 300px at 62% 40%, rgba(255,255,255,.025), transparent 70%),
    var(--paper);
  color:var(--ink);
  font-family:"Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,sans-serif;
  font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased;}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit;}
button{cursor:pointer;}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;}
.tnum{font-family:"Cascadia Mono",Consolas,ui-monospace,monospace;font-variant-numeric:tabular-nums;}

#shell{display:flex;min-height:100vh;}

#rail{width:196px;flex:0 0 196px;
  background:linear-gradient(168deg, rgba(14,21,29,.82), rgba(8,12,17,.94));
  color:#E8EBF0;backdrop-filter:blur(26px) saturate(1.4);
  border-right:1px solid var(--rule);box-shadow:var(--spec), 1px 0 0 rgba(0,0,0,.4);
  padding:18px 10px 12px;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;}
#rail .brand{padding:0 10px 13px;border-bottom:1px solid var(--rule);margin-bottom:10px;}
#rail .brand b{display:block;font-size:13.5px;color:#F4F8FC;font-weight:600;letter-spacing:-.015em;}
#rail .brand span{display:block;font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;color:#6F7C8A;margin-top:4px;}
.closedhead{display:flex;align-items:baseline;gap:12px;max-width:640px;}
.closedhead .sec{flex:1;}
.selbox{flex:0 0 auto;width:18px;height:18px;margin-top:2px;padding:0;position:relative;
  border-radius:5px;border:1.5px solid rgba(255,255,255,.22);background:rgba(255,255,255,.04);
  box-shadow:var(--spec);transition:all .15s;}
.selbox:hover{border-color:var(--accent);}
.selbox.on{background:linear-gradient(180deg,#B6E4FF,var(--accent));border-color:var(--accent);}
.selbox.on:after{content:"";position:absolute;left:5px;top:2px;width:4px;height:8px;
  border:solid #08222E;border-width:0 2px 2px 0;transform:rotate(42deg);}
.rr.selected{background:linear-gradient(90deg, rgba(143,214,255,.10), transparent 60%);}
@keyframes bulkin{from{opacity:0;transform:translateX(-50%) translateY(10px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
.bulkbar{position:fixed;left:50%;transform:translateX(-50%);bottom:22px;z-index:80;
  display:flex;align-items:center;gap:10px;width:max-content;max-width:calc(100vw - 32px);
  padding:11px 15px;border-radius:var(--r-pill);border:1px solid rgba(143,214,255,.3);
  background:linear-gradient(180deg, rgba(46,66,86,.96), rgba(28,40,54,.95));
  backdrop-filter:blur(20px) saturate(1.3);
  font-size:12px;color:var(--ink-2);
  box-shadow:var(--spec), 0 20px 50px -16px rgba(0,0,0,.8);
  animation:bulkin .2s cubic-bezier(.2,.9,.3,1);}
.bulkbar b{color:var(--ink);font-size:13px;}
.bulkbar .sp{width:4px;}
.startlist{display:flex;flex-direction:column;gap:11px;}
.startlist>div{display:flex;gap:12px;align-items:baseline;font-size:12.5px;color:var(--ink-2);line-height:1.5;}
.startlist>div>span{flex:0 0 auto;width:20px;height:20px;border-radius:50%;background:rgba(255,255,255,.08);
  display:inline-flex;align-items:center;justify-content:center;font-size:10.5px;color:var(--ink);}
.startlist b{color:var(--ink);font-weight:600;}
.verline{max-width:640px;margin:0 0 22px;padding:11px 15px;border-radius:var(--r-sm);
  border:1px solid var(--rule);background:rgba(255,255,255,.03);
  font-size:11.5px;color:var(--muted);line-height:1.6;}
.verline b{color:var(--ink-2);font-weight:600;}
.navbtn{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;
  background:none;border:0;color:#A9B4C1;border-radius:var(--r-sm);
  padding:8px 11px;text-align:left;font-size:12.5px;transition:all .18s;cursor:pointer;margin-bottom:2px;}
.navbtn:hover{color:#EAF0F6;background:rgba(255,255,255,.045);}
.navbtn.on{color:#F4F8FC;
  background:linear-gradient(96deg, rgba(143,214,255,.22), rgba(255,255,255,.03));
  box-shadow:var(--spec), 0 0 20px -6px rgba(143,214,255,.55);}
.navbtn .pill{font-family:"Cascadia Mono",Consolas,monospace;font-size:10px;font-weight:700;
  background:var(--carried);color:#1A1233;border-radius:var(--r-pill);padding:1px 6px;min-width:18px;text-align:center;}
.navbtn .pill.zero{display:none;}
.navsep{height:1px;margin:9px 4px;background:linear-gradient(90deg, rgba(255,255,255,.09), transparent 75%);}
#rail .spacer{flex:1;}
#rail .foot{padding-top:11px;border-top:1px solid var(--rule);}
#rail .foot button{width:100%;background:rgba(255,255,255,.05);border:1px solid var(--rule);color:#C3CCD7;
  padding:8px;font-size:11.5px;border-radius:var(--r-sm);margin-bottom:8px;transition:all .18s;
  backdrop-filter:blur(10px);box-shadow:var(--spec);}
#rail .foot button:hover{background:rgba(255,255,255,.09);border-color:rgba(255,255,255,.16);color:#EFEFF4;}
#tabWarn{font-size:10px;color:var(--soon);padding:6px 12px 0;line-height:1.4;display:none;}
#tabWarn .linkbtn{font-size:10px;color:var(--soon);}
#storeWarn{font-size:10px;color:#F8A5A0;padding:6px 12px 0;line-height:1.3;display:none;}
#main{flex:1;min-width:0;padding:26px 32px 70px;max-width:1180px;overflow-x:auto;}
#shell.panelon #main{max-width:none;}

.eyebrow{font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);font-weight:700;}
h1{font-family:"Segoe UI Variable Display","Segoe UI",system-ui,sans-serif;
  font-size:25px;font-weight:600;letter-spacing:-.022em;margin:3px 0 4px;}
h2.sec{font-size:15px;font-weight:600;letter-spacing:-.01em;margin:28px 0 9px;}
.dk{font-size:14px;font-weight:600;margin-bottom:6px;}
.dk:before{content:"● ";}
.dk.ok{color:var(--done);} .dk.warn{color:var(--soon);} .dk.bad{color:var(--overdue);}
.dkp{font-size:12.5px;color:var(--muted);line-height:1.6;margin:0;}
.dkp code{background:rgba(255,255,255,.06);padding:2px 6px;border-radius:6px;font-size:11.5px;}
.dkrow{font-size:12px;color:var(--ink-2);margin-top:9px;}
#lastSaved.ok{color:var(--done)!important;}
#lastSaved.bad{color:var(--overdue)!important;}
.libhead{font-size:13px;font-weight:600;margin:24px 0 9px;display:flex;align-items:baseline;gap:8px;}
.libhead span{font-size:11px;font-weight:400;color:var(--muted);}
.lede{color:var(--muted);font-size:13px;margin:0 0 20px;}

.card{border-radius:var(--r-lg);border:1px solid var(--rule);overflow:hidden;
  background:linear-gradient(180deg, rgba(22,31,42,.5), rgba(14,20,28,.42));
  backdrop-filter:blur(20px) saturate(1.25);box-shadow:var(--spec), var(--lift);}

.btn{background:linear-gradient(180deg, rgba(143,214,255,.20), rgba(143,214,255,.10));
  color:#F0F6FA;border:1px solid rgba(143,214,255,.32);
  padding:8px 15px;border-radius:var(--r-pill);font-size:12.5px;font-weight:500;
  transition:all .18s;cursor:pointer;backdrop-filter:blur(12px);box-shadow:var(--spec);}
.btn:hover{background:linear-gradient(180deg, rgba(143,214,255,.30), rgba(143,214,255,.16));
  border-color:rgba(143,214,255,.5);box-shadow:var(--spec), 0 0 20px -6px rgba(143,214,255,.6);}
.btn:active{transform:scale(0.975);}
.btn:focus-visible{outline:2px solid var(--focus);outline-offset:2px;}
.btn.ghost{background:rgba(255,255,255,.05);color:var(--ink-2);border-color:var(--rule);
  backdrop-filter:blur(12px);box-shadow:var(--spec);}
.btn.ghost:hover{background:rgba(255,255,255,.09);color:var(--ink);box-shadow:var(--spec);}
.btn.danger{background:rgba(255,124,92,.14);color:var(--overdue);border:1px solid rgba(255,124,92,.32);
  backdrop-filter:blur(12px);box-shadow:var(--spec);}
.btn.danger:hover{background:rgba(255,124,92,.2);box-shadow:var(--spec), 0 0 16px -4px rgba(255,124,92,.5);}
.btn.sm{padding:5px 12px;font-size:11px;}
.btn[disabled]{opacity:.32;cursor:not-allowed;pointer-events:none;box-shadow:none;}

.tag{display:inline-block;font-family:"Cascadia Mono",Consolas,monospace;
  font-size:9px;font-weight:700;letter-spacing:.1em;
  text-transform:uppercase;padding:3px 8px;border-radius:var(--r-pill);border:1px solid;
  vertical-align:middle;}
.tag.g0{color:var(--g0);border-color:rgba(143,179,245,.3);background:rgba(143,179,245,.11);}
.tag.g1{color:var(--g1);border-color:rgba(59,196,176,.3);background:rgba(59,196,176,.11);}
.tag.plain{color:var(--muted);border-color:rgba(255,255,255,.12);background:rgba(255,255,255,.05);}
.owner{font-family:"Cascadia Mono",Consolas,monospace;font-size:9px;font-weight:700;letter-spacing:.1em;
  text-transform:uppercase;padding:3px 8px;border-radius:var(--r-pill);
  background:rgba(255,255,255,.06);color:var(--muted);}
.owner.hra{background:rgba(255,255,255,.14);color:#EAF0F6;}
.owner.auto{background:rgba(255,255,255,.045);color:#7E8A97;}
.owner.custom{background:rgba(255,255,255,.09);color:#C3CCD7;}
.empty{padding:38px 20px;text-align:center;color:var(--muted);font-size:13px;}
.empty b{display:block;color:var(--ink);font-size:14px;margin-bottom:5px;}
label.f{display:block;font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--muted);font-weight:700;margin:0 0 7px;}
input[type=text],input[type=date],input[type=number],input[type=time],select,textarea{
  width:100%;padding:9px 12px;border:1px solid var(--rule);border-radius:var(--r-sm);
  background:rgba(255,255,255,.04);color:var(--ink);transition:all .18s;box-shadow:var(--spec);}
input[type=text]:focus,input[type=date]:focus,input[type=number]:focus,
input[type=time]:focus,select:focus,textarea:focus{
  outline:none;border-color:rgba(143,214,255,.6);
  box-shadow:var(--spec), 0 0 0 3px rgba(143,214,255,.16);}
textarea{resize:vertical;min-height:74px;line-height:1.5;}
input[type=date]::-webkit-calendar-picker-indicator,
input[type=time]::-webkit-calendar-picker-indicator{
  filter:invert(1);opacity:.62;cursor:pointer;
  width:19px;height:19px;padding:0;margin-left:6px;transition:opacity .15s;}
input[type=date]:hover::-webkit-calendar-picker-indicator,
input[type=date]:focus::-webkit-calendar-picker-indicator,
input[type=time]:hover::-webkit-calendar-picker-indicator,
input[type=time]:focus::-webkit-calendar-picker-indicator{opacity:1;}
.dateinline::-webkit-calendar-picker-indicator{width:17px;height:17px;margin-left:4px;}
.hint{font-size:11px;color:var(--muted);margin-top:7px;}

.spine{border-left:1.5px solid rgba(255,255,255,.09);margin-left:88px;}
.daygroup{position:relative;padding-bottom:6px;}
.dayhead{position:relative;padding:15px 0 8px 20px;}
.dayhead .lbl{font-size:12.5px;font-weight:600;letter-spacing:.01em;}
.dayhead .sub{font-size:10.5px;color:var(--muted);margin-top:1px;}
.dayhead .dot{position:absolute;left:-8px;top:19px;width:14px;height:14px;border-radius:50%;
  background:var(--paper);border:2px solid rgba(255,255,255,.16);}
.daygroup.od .dot{background:var(--carried);border-color:var(--carried);
  box-shadow:0 0 16px -2px rgba(184,164,240,.75);}
.daygroup.today .dot{background:var(--accent);border-color:var(--accent);
  box-shadow:0 0 18px -2px rgba(143,214,255,.85);}
.daygroup.od .lbl{color:var(--carried);}
.daygroup.today .lbl{color:var(--accent);}

.row{display:flex;align-items:flex-start;gap:12px;margin:0 0 7px 20px;padding:12px 14px;
  border-radius:var(--r-md);border:1px solid var(--rule);
  background:linear-gradient(180deg, rgba(32,43,57,.62), rgba(22,31,42,.5));
  box-shadow:var(--spec), var(--lift-sm);}
.row.od{border-color:rgba(184,164,240,.3);border-left:1px solid rgba(184,164,240,.3);
  background:linear-gradient(180deg, rgba(56,32,27,.6), rgba(30,20,20,.48));}
.tick{flex:0 0 auto;width:20px;height:20px;margin-top:1px;padding:0;position:relative;
  border-radius:var(--r-xs);border:1.5px solid rgba(255,255,255,.2);
  background:rgba(255,255,255,.04);box-shadow:var(--spec);transition:all .18s;line-height:1;font-size:0;}
.tick:hover{border-color:var(--accent);box-shadow:var(--spec), 0 0 12px -3px var(--accent);}
.tick.on{background:linear-gradient(180deg,#5FD9A0,var(--done));border-color:var(--done);
  box-shadow:var(--spec), 0 0 14px -3px rgba(75,200,142,.8);}
.tick.on:after{content:"";position:absolute;left:6px;top:2px;width:5px;height:10px;
  border:solid #06301D;border-width:0 2.5px 2.5px 0;transform:rotate(42deg);}
.tick[disabled]{opacity:.32;cursor:not-allowed;}

.bd{flex:1;min-width:0;}
.t1{font-size:13.5px;font-weight:550;letter-spacing:-.005em;}
.t2{font-size:11.5px;color:var(--muted);margin-top:4px;line-height:1.5;white-space:pre-wrap;}
.t2.stepnote{border-left:2px solid var(--rule);padding-left:8px;margin-top:6px;}
.who{display:flex;gap:7px;align-items:center;flex-wrap:wrap;margin-top:7px;font-size:11px;color:var(--muted);}
.who a{color:var(--ink-2);cursor:pointer;text-decoration:none;
  border-bottom:1px solid rgba(143,214,255,.32);}
.who a:hover{color:var(--accent);border-bottom-color:var(--accent);}
.row.rec{background:linear-gradient(180deg, rgba(24,38,44,.55), rgba(17,27,33,.46));
  border-color:rgba(59,196,176,.16);}

#cols{display:flex;gap:14px;align-items:flex-start;overflow-x:auto;padding-bottom:14px;}
.col{flex:1 1 272px;min-width:188px;max-width:340px;
  display:flex;flex-direction:column;min-height:150px;overflow:hidden;
  border-radius:var(--r-lg);border:1px solid var(--rule);
  background:
    radial-gradient(240px 130px at 50% -10%, rgba(255,255,255,.05), transparent 70%),
    linear-gradient(180deg, rgba(26,35,47,.62), rgba(16,23,31,.5));
  backdrop-filter:blur(20px) saturate(1.3);box-shadow:var(--spec), var(--lift);}
.col.t-prog{background:
    radial-gradient(240px 130px at 50% -10%, rgba(143,214,255,.16), transparent 70%),
    linear-gradient(180deg, rgba(23,36,50,.62), rgba(15,23,32,.5));
  border-color:rgba(143,214,255,.16);}
.col.t-wait{background:
    radial-gradient(240px 130px at 50% -10%, rgba(224,169,61,.16), transparent 70%),
    linear-gradient(180deg, rgba(38,32,22,.6), rgba(21,18,14,.5));
  border-color:rgba(224,169,61,.16);}
.col.t-done{background:
    radial-gradient(240px 130px at 50% -10%, rgba(75,200,142,.14), transparent 70%),
    linear-gradient(180deg, rgba(20,36,30,.6), rgba(13,22,19,.5));
  border-color:rgba(75,200,142,.15);}
.col.dragover{border-color:var(--focus);box-shadow:var(--spec), 0 0 26px -6px rgba(143,214,255,.6);}
.colhead{display:flex;align-items:center;gap:8px;padding:13px 15px 11px;border-bottom:1px solid var(--rule);}
.colhead .nm{font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;flex:1;min-width:0;color:var(--ink-2);}
.colhead .ct{font-family:"Cascadia Mono",Consolas,monospace;font-size:10.5px;color:var(--muted);
  background:rgba(255,255,255,.07);padding:2px 7px;border-radius:var(--r-pill);}
.colhead .x{background:none;border:0;color:var(--muted);font-size:15px;line-height:1;padding:0 2px;}
.colhead .x:hover{color:var(--overdue);}
.colbody{padding:11px;display:flex;flex-direction:column;gap:9px;flex:1;}
.kc{padding:12px 13px;border-radius:var(--r-md);border:1px solid var(--rule);cursor:grab;
  background:linear-gradient(180deg, rgba(38,50,65,.66), rgba(26,35,47,.54));
  box-shadow:var(--spec), var(--lift-sm);transition:all .18s;}
.kc:hover{border-color:rgba(143,214,255,.42);
  box-shadow:var(--spec), 0 0 22px -6px rgba(143,214,255,.7);}
.kc.dragging{opacity:.42;}
.kc .nm{font-size:13.5px;font-weight:600;letter-spacing:-.01em;}
.kc .meta{font-size:10.5px;color:var(--muted);margin-top:7px;display:flex;gap:6px;flex-wrap:wrap;align-items:center;}
.bar{height:4px;background:rgba(255,255,255,.07);border-radius:var(--r-pill);margin-top:10px;overflow:hidden;
  box-shadow:inset 0 1px 2px rgba(0,0,0,.4);}
.bar i{display:block;height:100%;border-radius:var(--r-pill);
  background:linear-gradient(90deg, var(--accent), #C9EBFF);
  box-shadow:0 0 10px -1px rgba(143,214,255,.8);}
.kc .next{font-size:11px;margin-top:8px;color:var(--ink-2);}
.kc .next.od{color:var(--carried);font-weight:600;}
.addcol{padding:6px 13px;border-radius:var(--r-pill);color:var(--muted);font-size:11.5px;
  border:1px dashed rgba(255,255,255,.16);background:rgba(255,255,255,.03);
  backdrop-filter:blur(10px);transition:all .18s;}
.addcol:hover{background:rgba(255,255,255,.06);border-color:rgba(143,214,255,.45);color:var(--ink);}
.boardhead{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin:0 0 20px;}
.boardhead .lede{margin:0;flex:1;min-width:220px;}

.detailhead{display:flex;justify-content:space-between;align-items:flex-start;gap:18px;flex-wrap:wrap;margin-bottom:16px;}
.facts{display:flex;gap:2px;flex-wrap:wrap;margin-top:14px;border-radius:var(--r-md);overflow:hidden;
  border:1px solid var(--rule);box-shadow:var(--spec), var(--lift);backdrop-filter:blur(16px);}
.fact{flex:1;min-width:130px;padding:11px 15px;
  background:linear-gradient(180deg, rgba(30,41,55,.6), rgba(20,28,38,.5));}
.fact .k{font-size:9px;letter-spacing:.15em;text-transform:uppercase;color:var(--muted);font-weight:700;}
.fact .v{font-size:13.5px;font-weight:550;margin-top:4px;}
.notask{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;}
.notask h2.sec{margin-bottom:8px;}
.notask .hint{margin:0;}
.weekhead{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin:0 0 20px;}
.weekhead .lede{margin:0;flex:1;min-width:240px;}
.donerow{align-items:center;}
.donerow .tick{pointer-events:none;}
.donerow .sbody{flex:1;min-width:0;}
.donerow .s1{color:var(--ink-2);}
.donerow .smeta{margin-top:4px;font-size:10.5px;}
.donerow .why{font-size:10.5px;color:var(--muted);font-style:italic;flex:0 0 auto;}
.calhead{display:flex;align-items:center;gap:8px;margin:0 0 14px;flex-wrap:wrap;}
.calhead h2{font-size:17px;font-weight:600;letter-spacing:-.01em;margin:0 8px;min-width:150px;}
.calgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px;}
.cdow{font-size:9px;letter-spacing:.15em;text-transform:uppercase;color:var(--muted);font-weight:700;padding:0 7px 3px;}
.cday{display:flex;flex-direction:column;gap:3px;align-items:stretch;text-align:left;min-height:88px;

.cchip.dim{color:var(--muted);background:rgba(255,255,255,.04);}
.cchip.ghost{background:transparent;box-shadow:inset 0 0 0 1px var(--rule);color:var(--muted);}
.cchip.hi{box-shadow:inset 2px 0 0 var(--soon);}
.cmore{font-size:9.5px;color:var(--muted);padding-left:6px;}
.calday .row{margin-left:0;}
.row.ghost{border-style:dashed;background:transparent;box-shadow:none;}

.donefoot{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:18px;}

.phasehead{display:flex;align-items:center;gap:10px;padding:14px 16px 10px;

.phasehead .pn{font-size:10px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-2);}
.phasehead .pc{font-size:10.5px;color:var(--muted);}
.phasehead .pbar{flex:1;max-width:140px;height:3px;border-radius:var(--r-pill);

.phasehead .pbar i{display:block;height:100%;border-radius:var(--r-pill);
  background:linear-gradient(90deg,var(--accent),#C9EBFF);}
.phasenow{font-size:10px;color:var(--muted);margin-top:5px;

.libphase{font-size:9.5px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;

.step{display:flex;gap:13px;padding:14px 16px;border-bottom:1px solid var(--rule-soft);position:relative;}

.step.blocked{background:linear-gradient(180deg, rgba(6,10,14,.5), rgba(6,10,14,.34));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.03), inset 0 8px 18px -12px rgba(0,0,0,.9);}
.step.blocked .s1{color:var(--muted);}
.step.blocked .s2{color:#6E7A87;}
.step.chained{padding-left:40px;}
.step.chained:before{content:"";position:absolute;left:22px;top:0;bottom:0;width:2px;border-radius:2px;
  background:linear-gradient(180deg, rgba(255,255,255,.14), rgba(255,255,255,.05));}
.step.chained.unlocked:before{background:linear-gradient(180deg, var(--done), rgba(75,200,142,.25));

.sbody{flex:1;min-width:0;}
.s1{font-size:13.5px;font-weight:550;letter-spacing:-.005em;}
.s2{font-size:11.5px;color:var(--ink-2);margin-top:4px;white-space:pre-wrap;line-height:1.5;}
.smeta{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-top:9px;}
.due{font-size:10.5px;font-weight:600;color:var(--muted);}

.blockmsg{font-size:10.5px;color:var(--soon);font-weight:600;}
.tsl{margin:8px 0 0 2px;padding-left:11px;border-left:1px solid var(--rule);
  display:flex;flex-direction:column;gap:5px;}
.tsi{display:flex;align-items:flex-start;gap:8px;}
.tick.xs{width:15px;height:15px;margin-top:1px;border-width:1.5px;border-radius:5px;}
.tick.xs.on:after{left:4px;top:1px;width:4px;height:7px;border-width:0 2px 2px 0;}
.tsi .lbl{font-size:11.5px;line-height:1.4;color:var(--ink-2);}

.tsrow{display:flex;align-items:center;gap:8px;}
.tsrow input{flex:1;}

.tsx{flex:0 0 auto;width:26px;height:26px;padding:0;font-size:15px;line-height:1;

  color:var(--muted);}

.linkbtn{background:none;border:0;color:var(--muted);font-size:10.5px;padding:0;
  text-decoration:underline;text-underline-offset:2px;}
.linkbtn:hover{color:var(--ink);}

.emprev{max-height:340px;overflow:auto;white-space:pre-wrap;font-size:12px;line-height:1.6;

.attlist{display:flex;flex-direction:column;gap:6px;}

.attrow:before{content:"\1F4CE  ";opacity:.8;}
.secthead{font-size:9.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);
  font-weight:700;padding:13px 16px 11px;border-bottom:1px solid var(--rule);
  background:rgba(255,255,255,.035);display:flex;align-items:center;gap:10px;}
.secthead .sp{flex:1;}
.dateinline{width:auto;padding:4px 10px;font-size:11px;border:1px solid var(--rule);
  border-radius:var(--r-pill);background:rgba(255,255,255,.05);
  font-family:"Cascadia Mono",Consolas,monospace;box-shadow:var(--spec);}

.wiz{max-width:820px;}
.qs{padding:24px 26px 6px;}
.q{margin-bottom:20px;}
.q:last-child{margin-bottom:0;}

.opt{background:rgba(255,255,255,.042);border:1px solid var(--rule);border-radius:var(--r-pill);
  padding:8px 15px;font-size:12.5px;color:var(--ink-2);
  backdrop-filter:blur(12px);box-shadow:var(--spec);transition:all .18s;}
.opt:hover{background:rgba(255,255,255,.08);color:var(--ink);}
.opt.on{background:linear-gradient(180deg, rgba(255,255,255,.16), rgba(255,255,255,.075));
  color:#FFF;border-color:rgba(255,255,255,.26);
  box-shadow:var(--spec), 0 0 20px -6px rgba(255,255,255,.4);}
.opt.g0.on{background:linear-gradient(180deg, rgba(143,179,245,.32), rgba(143,179,245,.16));
  border-color:rgba(143,179,245,.5);color:#EAF1FF;
  box-shadow:var(--spec), 0 0 22px -6px rgba(143,179,245,.65);}
.opt.g1.on{background:linear-gradient(180deg, rgba(59,196,176,.32), rgba(59,196,176,.16));
  border-color:rgba(59,196,176,.5);color:#DFFAF4;
  box-shadow:var(--spec), 0 0 22px -6px rgba(59,196,176,.65);}
.opt.sm{padding:6px 12px;font-size:11.5px;}
.opt.p-high.on{background:linear-gradient(180deg, rgba(224,169,61,.34), rgba(224,169,61,.16));
  border-color:rgba(224,169,61,.6);color:#FFE3B0;
  box-shadow:var(--spec), 0 0 20px -6px rgba(224,169,61,.7);}
.opt.p-normal.on{background:linear-gradient(180deg, rgba(255,255,255,.17), rgba(255,255,255,.08));
  border-color:rgba(255,255,255,.30);color:#FFF;
  box-shadow:var(--spec), 0 0 18px -7px rgba(255,255,255,.35);}
.opt.p-low.on{background:linear-gradient(180deg, rgba(255,255,255,.085), rgba(255,255,255,.035));
  border-color:rgba(255,255,255,.17);color:var(--ink-2);
  box-shadow:var(--spec);}
.preview{border-top:1px solid var(--rule);padding:15px 26px;font-size:12.5px;color:var(--ink-2);
  background:linear-gradient(180deg, rgba(143,214,255,.12), rgba(255,255,255,.02));}
.wizfoot{padding:16px 26px 20px;border-top:1px solid var(--rule);display:flex;gap:10px;
  align-items:center;flex-wrap:wrap;background:rgba(0,0,0,.16);}
.grid2{display:grid;grid-template-columns:repeat(2, minmax(0,1fr));gap:16px;}
.grid3{display:grid;grid-template-columns:repeat(3, minmax(0,1fr));gap:16px;}

.lib{display:flex;gap:12px;padding:13px 16px;border-bottom:1px solid var(--rule-soft);align-items:flex-start;}
.lib:last-child{border-bottom:0;}
.lib .ord{display:flex;flex-direction:column;gap:3px;flex:0 0 auto;}
.lib .ord button{background:rgba(255,255,255,.04);border:1px solid var(--rule);border-radius:6px;
  width:21px;height:17px;padding:0;line-height:1;font-size:9px;color:var(--muted);box-shadow:var(--spec);}
.lib .ord button:hover{border-color:var(--accent);color:var(--ink);}
.lib.off{opacity:.5;}

.rr{display:flex;gap:12px;align-items:flex-start;padding:13px 16px;border-bottom:1px solid var(--rule-soft);}
.rr:last-child{border-bottom:0;}

@keyframes mshake{10%,90%{transform:translateX(-2px)}30%,70%{transform:translateX(4px)}50%{transform:translateX(-5px)}100%{transform:translateX(0)}}
.modal.shake{animation:mshake .34s cubic-bezier(.36,.07,.19,.97);}
#veil{position:fixed;inset:0;background:rgba(6,10,14,.62);display:none;z-index:60;
  overflow-y:auto;padding:34px 16px;backdrop-filter:blur(6px);}
#veil.on{display:block;}
.modal{border-radius:var(--r-lg);max-width:640px;margin:0 auto;overflow:hidden;
  border:1px solid rgba(255,255,255,.1);
  background:linear-gradient(180deg, rgba(52,66,85,.8), rgba(30,40,54,.76));
  backdrop-filter:blur(30px) saturate(1.4);
  box-shadow:var(--spec), 0 30px 70px -20px rgba(0,0,0,.8);}
.mhead{padding:20px 24px 14px;border-bottom:1px solid var(--rule);}
.mhead h3{margin:0;font-family:"Segoe UI Variable Display","Segoe UI",system-ui,sans-serif;
  font-size:17px;font-weight:600;letter-spacing:-.015em;}
.mhead p{margin:4px 0 0;font-size:12px;color:var(--muted);}
.mbody{padding:20px 24px;}
.mbody .q{margin-bottom:18px;}
.mfoot{padding:16px 24px 20px;border-top:1px solid var(--rule);display:flex;gap:10px;
  align-items:center;background:rgba(0,0,0,.18);}
.mfoot .sp{flex:1;}

@keyframes alarmin{from{opacity:0;transform:translateY(14px) scale(.97)}to{opacity:1;transform:none}}
#alarm{position:fixed;right:22px;bottom:22px;z-index:90;width:min(400px,calc(100vw - 32px));
  display:none;border-radius:var(--r-lg);overflow:hidden;border:1px solid rgba(255,255,255,.12);
  background:linear-gradient(180deg, rgba(58,72,92,.96), rgba(32,42,56,.95));
  box-shadow:var(--spec), 0 30px 70px -18px rgba(0,0,0,.85);}
#alarm.on{display:block;animation:alarmin .26s cubic-bezier(.2,.9,.3,1);}
.alhd{display:flex;align-items:center;gap:9px;padding:14px 17px 0;}
.aldot{width:8px;height:8px;border-radius:50%;background:var(--soon);
  box-shadow:0 0 12px 2px rgba(224,169,61,.7);}
.alk{font-size:9.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--soon);font-weight:700;}
.alwhen{margin-left:auto;font-size:10.5px;color:var(--muted);}
.albd{padding:9px 17px 4px;}
.alt{font-size:15px;font-weight:600;letter-spacing:-.015em;line-height:1.35;}
.alsub{font-size:11.5px;color:var(--ink-2);margin-top:5px;line-height:1.5;white-space:pre-wrap;}
.almore{font-size:10.5px;color:var(--muted);margin-top:8px;}
.alft{padding:13px 17px 15px;display:flex;align-items:center;gap:7px;flex-wrap:wrap;}
.alsz{font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);
  font-weight:700;width:100%;margin-bottom:1px;}
.alb{font:inherit;font-size:11.5px;padding:6px 11px;border-radius:999px;cursor:pointer;
  border:1px solid var(--rule);background:rgba(255,255,255,.06);color:var(--ink-2);box-shadow:var(--spec);}
.alb:hover{background:rgba(255,255,255,.12);color:var(--ink);}
.alb.go{border:0;color:#08222E;font-weight:600;padding:7px 15px;
  background:linear-gradient(180deg,#B6E4FF,var(--accent));}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);
  background:linear-gradient(180deg, rgba(58,73,94,.92), rgba(38,50,66,.9));
  color:var(--ink);padding:11px 20px;border-radius:var(--r-pill);font-size:12.5px;
  border:1px solid rgba(255,255,255,.12);backdrop-filter:blur(24px);
  box-shadow:var(--spec), 0 16px 40px -12px rgba(0,0,0,.75);
  opacity:0;pointer-events:none;transition:opacity .18s;z-index:99;}
.toast.on{opacity:1;}
.nag{border-radius:var(--r-md);padding:11px 15px;font-size:12.5px;margin-bottom:20px;
  display:flex;gap:11px;align-items:center;flex-wrap:wrap;color:var(--ink-2);
  border:1px solid rgba(224,169,61,.28);
  background:linear-gradient(180deg, rgba(224,169,61,.13), rgba(224,169,61,.05));
  backdrop-filter:blur(16px);box-shadow:var(--spec), var(--lift);}
.nag b{color:var(--soon);font-weight:600;}
.nag.calm{border-color:rgba(143,214,255,.22);background:linear-gradient(180deg, rgba(143,214,255,.10), rgba(143,214,255,.03));}
.nag.calm b{color:var(--accent);}
.diskcard .dk{letter-spacing:-.01em;}

.prio{font-family:"Cascadia Mono",Consolas,monospace;font-size:8.5px;font-weight:700;
  letter-spacing:.1em;text-transform:uppercase;padding:2px 6px;border-radius:var(--r-pill);}
.prio.high{color:#FFD9A8;background:rgba(224,169,61,.22);}
.prio.low{color:var(--muted);background:rgba(255,255,255,.05);}
.row.pri-high{border-left:3px solid var(--soon);}
.row.pri-low .t1{color:var(--ink-2);}
.row .free,.smeta .free{font-style:italic;opacity:.75;color:var(--muted);}

@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;}}
@media (max-width:820px){
  #shell{flex-direction:column;}
  #rail{width:100%;flex:none;height:auto;position:static;flex-direction:row;flex-wrap:wrap;padding:10px;
    border-right:0;border-bottom:1px solid var(--rule);}
  #rail .brand{border:0;padding:0 12px 0 6px;margin:0;}

}

/* ---- Starter templates ---- */

  border-radius:var(--r-sm);border:1px solid var(--rule);background:rgba(255,255,255,.03);}

.starter .hint{margin:3px 0 0;}
.starter .btn{flex:0 0 auto;}
/* ---- PWA additions ---- */
html{-webkit-text-size-adjust:100%;}
body{overscroll-behavior-y:none;-webkit-tap-highlight-color:transparent;}
#pwaBar{display:none;position:fixed;left:12px;right:12px;z-index:70;
  top:calc(env(safe-area-inset-top) + 10px);max-width:560px;margin:0 auto;
  padding:12px 14px;border-radius:var(--r-md);font-size:13px;line-height:1.4;
  background:linear-gradient(180deg, rgba(58,73,94,.96), rgba(38,50,66,.96));
  border:1px solid rgba(255,255,255,.14);box-shadow:var(--spec), var(--lift);}
#pwaBar.on{display:flex;gap:12px;align-items:center;}
#pwaBar .msg{flex:1;}
#pwaBar button{flex:0 0 auto;border-radius:var(--r-pill);padding:8px 14px;border:1px solid var(--rule);
  background:rgba(255,255,255,.07);color:var(--ink);}
#pwaBar button.go{border:0;color:#08222E;font-weight:600;background:linear-gradient(180deg,#B6E4FF,var(--accent));}
@media (display-mode:standalone){ #shell{min-height:100dvh;} }
@media (max-width:820px){
  /* bottom tab bar instead of the side rail */
  body{padding-bottom:calc(64px + env(safe-area-inset-bottom));}
  #rail{position:fixed;left:0;right:0;bottom:0;top:auto;z-index:50;width:100%;height:auto;
    flex-direction:row;flex-wrap:nowrap;align-items:stretch;gap:2px;
    overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;scrollbar-width:none;
    padding:6px 8px calc(6px + env(safe-area-inset-bottom));
    border-right:0;border-bottom:0;border-top:1px solid var(--rule);
    background:linear-gradient(180deg, rgba(14,21,29,.92), rgba(8,12,17,.98));}
  #rail::-webkit-scrollbar{display:none;}
  #rail .brand,#rail .foot,#rail .spacer,#tabWarn,.navsep{display:none!important;}
  #storeWarn{display:none!important;}
  .navbtn{flex:0 0 auto;min-width:76px;min-height:48px;padding:6px 10px;margin:0;
    flex-direction:column;justify-content:center;gap:2px;text-align:center;font-size:11.5px;white-space:nowrap;}
  .navbtn .pill{position:absolute;top:2px;right:6px;}
  .navbtn{position:relative;}
  #main{padding:calc(env(safe-area-inset-top) + 16px) calc(14px + env(safe-area-inset-left)) 36px calc(14px + env(safe-area-inset-right));}
  /* iOS zooms the page when a field under 16px gets focus */
  input,select,textarea{font-size:16px!important;}
  button,.btn,.alb,select{min-height:40px;}
  /* modals become a near-full-height sheet */
  #veil{padding:calc(env(safe-area-inset-top) + 10px) 8px calc(10px + env(safe-area-inset-bottom));}
  .mhead{padding:16px 16px 12px;}
  .toast{bottom:calc(76px + env(safe-area-inset-bottom));max-width:90vw;text-align:center;}
  .col{flex:1 1 100%;max-width:none;}
  .closedhead,.verline,.card{max-width:none;}
  table{display:block;overflow-x:auto;-webkit-overflow-scrolling:touch;}
}
@media (max-width:820px) and (display-mode:standalone){
  #pwaBar{top:calc(env(safe-area-inset-top) + 8px);}
}

function normaliseLoaded(){

function migrate(){
  if(!S.processes) S.processes=[];

  rebuildProcesses();
  seedNewProcesses();
  seedNewRecurring();

var PRE_SEED_RECURRING = [];

function seedNewRecurring(){
  if(!S.recurring) S.recurring=[];
  if(!S.seededRecurring){
    var seen={};
    S.recurring.forEach(function(r){ seen[r.id]=1; });
    PRE_SEED_RECURRING.forEach(function(id){ seen[id]=1; });
    S.seededRecurring = Object.keys(seen);
  }
  DEFAULT_RECURRING.forEach(function(d){
    if(S.seededRecurring.indexOf(d.id)!==-1) return;
    var c=Object.assign({},d); c.next=firstOccurrence(c); c.anchor=firstIntended(c);
    S.recurring.push(c);
    S.seededRecurring.push(d.id);
  });
}

function seedNewProcesses(){
  if(!S.seededProcesses){
    var seen={};
    S.template.forEach(function(s){ seen[stepProcess(s)]=1; });
    S.seededProcesses=Object.keys(seen);
  }
  PROCESSES.forEach(function(P){
    if(S.seededProcesses.indexOf(P.id)!==-1) return;
    var add=DEFAULT_STEPS.filter(function(s){ return stepProcess(s)===P.id; });
    S.template=S.template.concat(JSON.parse(JSON.stringify(add)));
    S.seededProcesses.push(P.id);
  });
}

/* SYNC-BEGIN */
/* ---- Sync: per-record stamps, deletion markers and merge ----
   Every record gets updatedAt when it changes (stamped inside save()). Removing a
   record leaves a marker with the time, so another device can tell "deleted" from
   "never had it". Merging two copies is then record by record: the newer change
   wins, deletions carry over, and nothing is lost just because both devices were
   edited. Steps inside a checklist or task are merged individually. */
var SYNC_TOMB_MS=180*864e5;
var SYNC_COLLS=[
  {k:"cases",     nested:"steps"},
  {k:"template"},
  {k:"recurring"},
  {k:"tasks",     nested:"steps"},
  {k:"processes"},
  {k:"doneLog"},
  {k:"columns"}
];
var SYNC_SETS=["units","groups"];
var SYNC_CFG=["workDays","eodTime"];
var syncSnap=null;

function syncClone(o){ return JSON.parse(JSON.stringify(o)); }
function syncCanon(v){
  if(v===null||typeof v!=="object") return JSON.stringify(v)||"null";
  if(Array.isArray(v)) return "["+v.map(syncCanon).join(",")+"]";
  return "{"+Object.keys(v).sort().filter(function(k){ return v[k]!==undefined; })
    .map(function(k){ return JSON.stringify(k)+":"+syncCanon(v[k]); }).join(",")+"}";
}
function syncHash(r,nested){
  var o={};
  Object.keys(r).forEach(function(k){ if(k==="updatedAt"||k==="stomb"||k===nested) return; o[k]=r[k]; });
  return syncCanon(o);
}
function syncCfg(st){
  var o={}; SYNC_CFG.forEach(function(k){ if(st[k]!==undefined) o[k]=st[k]; });
  return syncCanon(o);
}
function syncFind(list,id){
  for(var i=0;i<(list||[]).length;i++){ if(list[i] && list[i].id===id) return list[i]; }
  return null;
}

/* Remember what every record looked like at the last save/load, so the next
   save can tell which ones changed. Call whenever S is replaced wholesale. */
function syncReset(){
  var snap={rec:{},set:{},cfg:syncCfg(S)};
  SYNC_COLLS.forEach(function(C){
    (S[C.k]||[]).forEach(function(r){
      if(!r||!r.id) return;
      snap.rec[C.k+"|"+r.id]={h:syncHash(r,C.nested),u:r.updatedAt||0};
      if(C.nested) (r[C.nested]||[]).forEach(function(s){
        if(s&&s.id) snap.rec[C.k+"|"+r.id+"|"+s.id]={h:syncHash(s),u:s.updatedAt||0};
      });
    });
  });
  SYNC_SETS.forEach(function(k){ var m={}; (S[k]||[]).forEach(function(n){ m[n]=1; }); snap.set[k]=m; });
  syncSnap=snap;
}

/* Called from save(): stamp what changed, leave a marker for what disappeared. */
function syncStamp(now){
  if(!S) return;
  if(!syncSnap) syncReset();
  now=now||Date.now();
  var seen={}, snap=syncSnap.rec;
  if(!S.tomb) S.tomb={};
  function touch(key,r,nested,parent){
    var h=syncHash(r,nested), prev=snap[key];
    seen[key]=1;
    if(!prev || prev.h!==h) r.updatedAt=now;
    else if(!r.updatedAt && prev.u) r.updatedAt=prev.u;
    snap[key]={h:h,u:r.updatedAt||0};
  }
  SYNC_COLLS.forEach(function(C){
    if(!S.tomb[C.k]) S.tomb[C.k]={};
    (S[C.k]||[]).forEach(function(r){
      if(!r||!r.id) return;
      touch(C.k+"|"+r.id,r,C.nested);
      delete S.tomb[C.k][r.id];
      if(C.nested) (r[C.nested]||[]).forEach(function(s){
        if(!s||!s.id) return;
        touch(C.k+"|"+r.id+"|"+s.id,s,null);
        if(r.stomb) delete r.stomb[s.id];
      });
    });
  });
  Object.keys(snap).forEach(function(key){
    if(seen[key]) return;
    var p=key.split("|");
    delete snap[key];
    if(p.length===2){ S.tomb[p[0]][p[1]]=now; }
    else {
      var parent=syncFind(S[p[0]],p[1]);
      if(parent){ if(!parent.stomb) parent.stomb={}; parent.stomb[p[2]]=now; }
    }
  });
  SYNC_SETS.forEach(function(k){
    if(!S.setMeta) S.setMeta={};
    var m=S.setMeta[k]||(S.setMeta[k]={at:{},del:{}}), cur={};
    (S[k]||[]).forEach(function(n){ cur[n]=1; if(!syncSnap.set[k][n]) m.at[n]=now; });
    Object.keys(syncSnap.set[k]).forEach(function(n){ if(!cur[n]) m.del[n]=now; });
    syncSnap.set[k]=cur;
  });
  var cfg=syncCfg(S);
  if(cfg!==syncSnap.cfg){ S.settingsAt=now; syncSnap.cfg=cfg; }
  syncPrune(S,now);
}

/* Markers older than this are dropped; a device offline longer than that should
   be restored rather than merged. */
function syncPrune(st,now){
  var cut=now-SYNC_TOMB_MS;
  function clean(m){ if(!m) return; Object.keys(m).forEach(function(k){ if(m[k]<cut) delete m[k]; }); }
  Object.keys(st.tomb||{}).forEach(function(k){ clean(st.tomb[k]); });
  Object.keys(st.setMeta||{}).forEach(function(k){ clean(st.setMeta[k].del); });
  SYNC_COLLS.forEach(function(C){
    if(C.nested) (st[C.k]||[]).forEach(function(r){
      clean(r.stomb); if(r.stomb && !Object.keys(r.stomb).length) delete r.stomb;
    });
  });
}

function syncOrder(lids,rids,have){
  var out=lids.filter(function(id,i){ return have[id] && lids.indexOf(id)===i; });
  rids.forEach(function(id,i){
    if(!have[id] || out.indexOf(id)!==-1) return;
    var j=i-1; while(j>=0 && out.indexOf(rids[j])===-1) j--;
    if(j<0) out.push(id); else out.splice(out.indexOf(rids[j])+1,0,id);
  });
  return out;
}

/* Merge two lists of records that carry an id and updatedAt. */
function syncMergeList(Ll,Rl,TL,TR,nested,cnt){
  Ll=Ll||[]; Rl=Rl||[]; TL=TL||{}; TR=TR||{};
  var Lm={},Rm={},seen={},res={};
  Ll.forEach(function(r){ if(r&&r.id) Lm[r.id]=r; });
  Rl.forEach(function(r){ if(r&&r.id) Rm[r.id]=r; });
  Ll.concat(Rl).forEach(function(x){
    if(!x||!x.id||seen[x.id]) return;
    seen[x.id]=1;
    var id=x.id, l=Lm[id], r=Rm[id], tl=TL[id]||0, tr=TR[id]||0, pick=null;
    if(l && !r){
      if(tr && tr>=(l.updatedAt||0)) cnt.removed++; else pick=syncClone(l);
    } else if(r && !l){
      if(tl && tl>=(r.updatedAt||0)){ /* stays deleted here */ }
      else { pick=syncClone(r); cnt.added++; }
    } else {
      var lu=l.updatedAt||0, ru=r.updatedAt||0, win=l;
      var same=syncHash(l,nested)===syncHash(r,nested);
      if(!same){
        if(ru>lu || (ru===lu && cnt.remoteNewer)){ win=r; cnt.updated++; } else cnt.kept++;
      }
      pick=syncClone(win);
      pick.updatedAt=same ? Math.max(lu,ru) : (win.updatedAt||0);
      if(!pick.updatedAt) delete pick.updatedAt;
      if(nested){
        var sub=syncMergeList(l[nested],r[nested],l.stomb,r.stomb,null,cnt);
        pick[nested]=sub.list;
        if(Object.keys(sub.tomb).length) pick.stomb=sub.tomb; else delete pick.stomb;
      }
    }
    if(pick) res[id]=pick;
  });
  var tomb={};
  [TL,TR].forEach(function(t){
    Object.keys(t).forEach(function(id){
      if(res[id]) return;
      if(t[id]>=cnt.now-SYNC_TOMB_MS && (!tomb[id]||t[id]>tomb[id])) tomb[id]=t[id];
    });
  });
  var order=syncOrder(Ll.map(function(r){return r&&r.id;}), Rl.map(function(r){return r&&r.id;}), res);
  return {list:order.map(function(id){ return res[id]; }), tomb:tomb};
}

/* Merge `remote` into a copy of `local`. Neither argument is changed.
   Returns {merged, report:{added,updated,removed,kept}, changed}. */
function syncMerge(local,remote,now){
  now=now||Date.now();
  var L=syncClone(local), R=syncClone(remote), out=syncClone(local);
  var cnt={added:0,updated:0,removed:0,kept:0,now:now,remoteNewer:(R.rev||0)>(L.rev||0)};
  var tomb={};
  SYNC_COLLS.forEach(function(C){
    var m=syncMergeList(L[C.k],R[C.k],(L.tomb||{})[C.k],(R.tomb||{})[C.k],C.nested,cnt);
    out[C.k]=m.list; tomb[C.k]=m.tomb;
  });
  out.tomb=tomb;

  out.setMeta={};
  SYNC_SETS.forEach(function(k){
    var lm=(L.setMeta||{})[k]||{}, rm=(R.setMeta||{})[k]||{};
    var at={},del={},inL={},inR={},names=[];
    (L[k]||[]).forEach(function(n){ inL[n]=1; if(names.indexOf(n)===-1) names.push(n); });
    (R[k]||[]).forEach(function(n){ inR[n]=1; if(names.indexOf(n)===-1) names.push(n); });
    [[lm.at,at],[rm.at,at],[lm.del,del],[rm.del,del]].forEach(function(p){
      Object.keys(p[0]||{}).forEach(function(n){ if(!(p[1][n]>=p[0][n])) p[1][n]=p[0][n]; });
    });
    var res=[];
    names.forEach(function(n){
      if((del[n]||0)>(at[n]||0)){ if(inL[n]) cnt.removed++; }
      else { res.push(n); if(!inL[n]) cnt.added++; }
    });
    out[k]=res;
    Object.keys(del).forEach(function(n){ if(del[n]<now-SYNC_TOMB_MS) delete del[n]; });
    out.setMeta[k]={at:at,del:del};
  });

  var ls=L.settingsAt||0, rs=R.settingsAt||0;
  if(syncCfg(L)!==syncCfg(R)){
    if(rs>ls || (rs===ls && cnt.remoteNewer)){
      SYNC_CFG.forEach(function(k){ if(R[k]!==undefined) out[k]=syncClone(R[k]); });
      cnt.updated++;
    } else cnt.kept++;
  }
  out.settingsAt=Math.max(ls,rs)||undefined;
  if(out.settingsAt===undefined) delete out.settingsAt;

  ["lastExport","eodDone"].forEach(function(k){
    if(R[k] && (!out[k] || R[k]>out[k])) out[k]=R[k];
  });
  ["seededProcesses","seededRecurring"].forEach(function(k){
    var u=(L[k]||[]).slice();
    (R[k]||[]).forEach(function(x){ if(u.indexOf(x)===-1) u.push(x); });
    if(u.length || L[k] || R[k]) out[k]=u;
  });

  /* Keep things that others still depend on. */
  var haveP={}; out.processes.forEach(function(p){ haveP[p.id]=1; });
  out.cases.forEach(function(c){
    if(!c.process || haveP[c.process]) return;
    var src=syncFind(local.processes,c.process)||syncFind(remote.processes,c.process);
    if(!src) return;
    out.processes.push(syncClone(src)); haveP[c.process]=1;
    delete out.tomb.processes[c.process];
    var haveT={}; out.template.forEach(function(s){ haveT[s.id]=1; });
    (local.template||[]).concat(remote.template||[]).forEach(function(s){
      if(s.process===c.process && !haveT[s.id]){
        out.template.push(syncClone(s)); haveT[s.id]=1; delete out.tomb.template[s.id];
      }
    });
    cnt.kept++;
  });
  var haveC={}; (out.columns||[]).forEach(function(c){ haveC[c.id]=1; });
  if(out.columns && out.columns.length){
    out.cases.forEach(function(c){

var fileHandle=null;

function diskSupported(){ return typeof window.showSaveFilePicker==="function"; }

function idbDo(mode,fn){
  return new Promise(function(res,rej){
    var r=indexedDB.open("tracker_file",1);
    r.onupgradeneeded=function(){ r.result.createObjectStore("h"); };
    r.onerror=function(){ rej(r.error); };
    r.onsuccess=function(){
      var db=r.result, t=db.transaction("h",mode), st=t.objectStore("h");
      var out=fn(st);
      t.oncomplete=function(){ db.close(); res(out&&out.result!==undefined?out.result:out); };
      t.onerror=function(){ db.close(); rej(t.error); };
    };
  });
}
function rememberHandle(h){ return idbDo("readwrite",function(st){ st.put(h,"data"); }); }
function recallHandle(){  return idbDo("readonly", function(st){ return st.get("data"); }); }

function writeDisk(){
  if(diskState!=="connected" || !fileHandle) return Promise.resolve();
  return fileHandle.createWritable()
    .then(function(w){ return w.write(JSON.stringify(S,null,2)).then(function(){ return w.close(); }); })
    .then(function(){ lastDiskWrite=new Date(); stamp(); })

function restoreDisk(){
  if(!diskSupported()){ diskState="unsupported"; stamp(); return; }
  recallHandle().then(function(h){
    if(!h){ diskState="off"; stamp(); return; }
    fileHandle=h;
    return h.queryPermission({mode:"readwrite"}).then(function(perm){
      diskState = (perm==="granted") ? "connected" : "needsPermission";
      stamp(); render();
    });
  }).catch(function(){ diskState="off"; stamp(); });
}

function reconnectDisk(){
  if(!fileHandle) return;
  fileHandle.requestPermission({mode:"readwrite"}).then(function(perm){
    if(perm==="granted"){ diskState="connected"; writeDisk().then(function(){ render(); toast("Reconnected"); }); }
    else { toast("Permission was not granted"); }
  }).catch(function(){ toast("Could not reconnect to the file"); });
}

var pendingExternal=false, pendingNoticed=false;
function writeStore(){
  try{
    var raw=localStorage.getItem(KEY), cur=0;
    if(raw){ try{ cur=JSON.parse(raw).rev||0; }catch(x){} }
    if(cur>(S.rev||0)){
      var keepMine=confirm("The tracker was changed in another tab while you were working here.\n\n"+
        "OK \u2014 keep what you just did in this tab. The other tab\u2019s change is overwritten.\n"+
        "Cancel \u2014 keep the other tab\u2019s version. What you just did here is discarded.");
      if(!keepMine){ writePending=false; pendingExternal=false; adoptStored(raw); toast("Loaded the other tab\u2019s version"); return; }
    }
    S.rev=Math.max(cur,(S.rev||0))+1;
    S.savedBy=APP_VERSION;
    localStorage.setItem(KEY, JSON.stringify(S));
    writePending=false; pendingExternal=false; pendingNoticed=false;
    stamp();
  }catch(e){ writePending=false; toast("Could not autosave \u2014 export a backup."); }

function today(){ var d=new Date(); d.setHours(0,0,0,0); return d; }
function parseD(s){ if(!s) return null; var p=String(s).split("-"); return new Date(+p[0],+p[1]-1,+p[2]); }
function isoD(d){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function addDays(d,n){ var x=new Date(d.getTime()); x.setDate(x.getDate()+n); return x; }
function daysBetween(a,b){ return Math.round((b-a)/86400000); }
var DOW=["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
var MON=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
function fmtD(d){ return d? DOW[d.getDay()].slice(0,3)+" "+d.getDate()+" "+MON[d.getMonth()] : "—"; }
function fmtLong(d){ return DOW[d.getDay()]+" "+d.getDate()+" "+MON[d.getMonth()]; }
function fmtTime(d){ return String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0"); }
function relD(d){
  var n=daysBetween(today(),d);
  if(n===0) return "today"; if(n===1) return "tomorrow";
  if(n<0) return Math.abs(n)+"d ago";
  return "in "+n+"d";
}
function dayShort(n){ return DOW[n].slice(0,3); }
function workDays(){
  var w=(S && S.workDays);
  return (w && w.length) ? w : [0,1,2,3,4,5,6];
}
function isWorkDay(d){ return workDays().indexOf(d.getDay())!==-1; }

function workday(d){
  if(!S || !S.workDays || !S.workDays.length) return d;
  if(isWorkDay(d)) return d;
  for(var i=1;i<=7;i++){
    var back=addDays(d,-i); if(isWorkDay(back)) return back;
    var fwd=addDays(d,i);   if(isWorkDay(fwd))  return fwd;
  }
  return d;
}
function nextWorkDay(d,inclusive){
  var w=workDays();
  if(inclusive && w.indexOf(d.getDay())!==-1) return d;
  for(var i=1;i<=7;i++){
    var n=addDays(d,i);
    if(w.indexOf(n.getDay())!==-1) return n;
  }
  return addDays(d,1);
}
function workDaysLabel(){
  var w=workDays();
  if(w.length===7) return "every day";
  return [1,2,3,4,5,6,0].filter(function(n){return w.indexOf(n)!==-1;}).map(dayShort).join(", ");
}

function uid(){ return Math.random().toString(36).slice(2,9); }

function stepProcess(s){ return s.process || ""; }
function caseProcess(c){ return c.process || ""; }

function appliesTo(step,c){
  if(stepProcess(step)!==caseProcess(c)) return false;
  if(step.inst && step.inst!=="*" && step.inst!==c.inst) return false;
  if(step.units!=="*" && (!step.units || step.units.indexOf(c.unit)===-1)) return false;
  if(step.when && step.when.length){
    for(var i=0;i<step.when.length;i++){ if(!c[step.when[i]]) return false; }
  }
  return true;
}
function buildSteps(c){
  var start=parseD(c.start), created=parseD(c.created)||today(), out=[];
  S.template.forEach(function(s){
    if(!appliesTo(s,c)) return;
    out.push({
      id:s.id, t:s.t, d:s.d, owner:s.owner, phase:s.phase||null,
      needs: s.needs? s.needs.slice() : null,
      due: isoD(computeDue(s,start,created)),
      done:false, doneAt:null, note:""
    });
  });
  return out;
}
function computeDue(s,start,created){
  if(s.asap) return nextWorkDay(created,true);

  var due = addDays(start, s.off||0);
  var floor=addDays(created,1);
  if(due<floor) due=floor;
  due=workday(due);
  if(due<created) due=workday(addDays(created,3));
  return due;
}
function findStep(c,sid){ return c.steps.filter(function(x){return x.id===sid;})[0]; }
function isBlocked(c,st){
  if(!st.needs||!st.needs.length) return false;
  for(var i=0;i<st.needs.length;i++){
    var f=findStep(c,st.needs[i]);
    if(f && !f.done) return true;
  }
  return false;
}
function blockedByName(c,st){
  if(!st.needs) return "";

  st.needs.forEach(function(id){ var f=findStep(c,id); if(f&&!f.done) n.push(f.t.toLowerCase()); });
  return n.join(" and ");
}
function isActive(c){ return !c.archived && !c.cancelled; }
function caseState(c){ return c.cancelled ? "cancelled" : (c.archived ? "archived" : "active"); }

function phasesOf(c){
  var order=[], seen={};

    var ph=s.phase||"";

  return order;
}
function phaseProgress(c,ph){
  var mine=c.steps.filter(function(s){ return (s.phase||"")===ph && s.owner!=="AUTO"; });
  return { done: mine.filter(function(s){return s.done;}).length, total: mine.length };
}
function currentPhase(c){

}

function caseProgress(c){
  var mine=c.steps.filter(function(s){ return s.owner!=="AUTO"; });
  return { done: mine.filter(function(s){return s.done;}).length, total: mine.length };
}
function nextOpen(c){
  var o=c.steps.filter(function(s){ return !s.done && !isBlocked(c,s) && s.owner!=="AUTO"; });
  o.sort(function(a,b){ return a.due<b.due?-1:1; });
  return o[0]||null;
}
function instTag(c){

function firstIntended(r){
  var t=today();
  if(r.freq==="yearly"){
    var d=new Date(t.getFullYear(), r.month||0, r.day||1);
    if(d<t) d=new Date(t.getFullYear()+1, r.month||0, r.day||1);
    return isoD(d);
  }
  if(r.freq==="daily") return isoD(nextWorkDay(t,true));
  if(r.freq==="quarterly") return isoD(addDays(t,7));
  if(r.freq==="monthly") return isoD(new Date(t.getFullYear(), t.getMonth()+1, 1));
  var target=(r.dow===undefined?4:r.dow);
  return isoD(addDays(t,(target-t.getDay()+7)%7));
}
function firstOccurrence(r){
  return isoD(workday(parseD(firstIntended(r))));
}
function advance(r){
  if(r.freq==="daily"){ r.next=isoD(nextWorkDay(parseD(r.next),false)); r.anchor=r.next; return; }
  var d=parseD(r.anchor||r.next);
  if(r.freq==="weekly") d=addDays(d,7);
  else if(r.freq==="biweekly") d=addDays(d,14);
  else if(r.freq==="monthly") d=new Date(d.getFullYear(),d.getMonth()+1,d.getDate());
  else if(r.freq==="quarterly") d=new Date(d.getFullYear(),d.getMonth()+3,d.getDate());
  else if(r.freq==="yearly") d=new Date(d.getFullYear()+1,d.getMonth(),d.getDate());
  else d=addDays(d,7);
  r.anchor=isoD(d);
  r.next=isoD(workday(d));
}

function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,function(m){

function dueItems(days){
  var h=addDays(today(), days===undefined?7:days), out=[];
  S.cases.forEach(function(c){
    if(!isActive(c)) return;
    c.steps.forEach(function(s){
      if(s.done || s.owner==="AUTO" || isBlocked(c,s)) return;
      var d=parseD(s.due);
      if(d<=h) out.push({kind:"step",date:d,c:c,s:s});
    });
  });
  S.recurring.forEach(function(r){
    var d=parseD(r.next);
    if(d<=h) out.push({kind:"recur",date:d,r:r});
  });
  (S.tasks||[]).forEach(function(t){
    if(t.done) return;
    var from=parseD(t.remind||t.due);
    var at=parseD(t.due||t.remind);
    if(from && at && from<=h) out.push({kind:"task",date:at,t:t});
  });
  out.sort(function(a,b){

}

function colTint(name){
  var n=String(name||"").toLowerCase();
  if(/complet|done|finish|closed/.test(n)) return "t-done";
  if(/wait|block|hold|pending/.test(n))    return "t-wait";
  if(/progress|doing|active|current/.test(n)) return "t-prog";
  return "";
}

function wireDnD(){
  var dragId=null;
  document.querySelectorAll(".kc").forEach(function(el){
    el.addEventListener("dragstart",function(e){ dragId=el.dataset.cid; el.classList.add("dragging");
      e.dataTransfer.effectAllowed="move"; try{e.dataTransfer.setData("text/plain",dragId);}catch(x){} });
    el.addEventListener("dragend",function(){ el.classList.remove("dragging"); dragId=null; });
  });
  document.querySelectorAll(".col").forEach(function(col){
    col.addEventListener("dragover",function(e){ e.preventDefault(); col.classList.add("dragover"); });
    col.addEventListener("dragleave",function(){ col.classList.remove("dragover"); });
    col.addEventListener("drop",function(e){
      e.preventDefault(); col.classList.remove("dragover");
      var id=dragId; try{ id=e.dataTransfer.getData("text/plain")||dragId; }catch(x){}
      var c=S.cases.filter(function(x){return x.id===id;})[0];
      if(c){ c.col=col.dataset.col; save(); render(); }
    });
  });
}

  var shown=names.slice(0,8).join("\n");

var EOD_DEFAULT_TIME="15:00";
function eodTime(){ return (S && S.eodTime) || ""; }
function caseName(cid){ var c=S.cases.filter(function(x){return x.id===cid;})[0]; return c?c.name:null; }

function eodReport(){
  var t=isoD(today()), nw=nextWorkDay(today(),false), nwIso=isoD(nw);
  var done=[], open={od:[],today:[],next:[]};
  S.cases.forEach(function(c){
    if(c.cancelled) return;
    c.steps.forEach(function(st){
      if(st.owner==="AUTO") return;
      if(st.done){ if(st.doneAt===t) done.push({t:st.t, who:c.name}); return; }
      if(c.archived || isBlocked(c,st)) return;
      var d=st.due;
      if(!d) return;
      if(d<t) open.od.push({t:st.t, who:c.name, d:d});
      else if(d===t) open.today.push({t:st.t, who:c.name});
      else if(d<=nwIso) open.next.push({t:st.t, who:c.name, d:d});
    });
  });
  (S.tasks||[]).forEach(function(x){
    if(x.done){ if(x.doneAt===t) done.push({t:x.t, who:caseName(x.cid)}); return; }
    var d=x.due||x.remind; if(!d) return;
    if(d<t) open.od.push({t:x.t, who:caseName(x.cid), d:d});
    else if(d===t) open.today.push({t:x.t, who:caseName(x.cid)});
    else if(d<=nwIso) open.next.push({t:x.t, who:caseName(x.cid), d:d});
  });
  (S.recurring||[]).forEach(function(r){
    if(r.freq==="daily") return;
    if(r.lastDone===t) done.push({t:r.t, who:null, rec:true});
    if(r.next<t) open.od.push({t:r.t, who:null, d:r.next, rec:true});
    else if(r.next===t) open.today.push({t:r.t, who:null, rec:true});
    else if(r.next<=nwIso) open.next.push({t:r.t, who:null, d:r.next, rec:true});
  });
  return {done:done, open:open, next:nw};
}
function eodItemText(x, withDue){
  var who = x.who ? " \u2014 "+x.who : (x.rec ? " (repeating)" : "");
  return x.t + who + (withDue && x.d ? " (planned for "+fmtD(parseD(x.d))+")" : "");
}
function eodSections(){
  var R=eodReport(), secs=[];
  secs.push({head:"Done today", sub:null,

var calMonth=null, calSel=null;
var CAL_MONTHS=["January","February","March","April","May","June","July","August","September","October","November","December"];
function calItems(fromIso,toIso,noGhosts){
  var out=[];
  function inR(d){ return d && d>=fromIso && d<=toIso; }
  S.cases.forEach(function(c){
    if(!isActive(c)) return;
    c.steps.forEach(function(st){
      if(st.done || st.owner==="AUTO" || !inR(st.due)) return;
      out.push({kind:"step", date:parseD(st.due), c:c, s:st, blocked:isBlocked(c,st)});
    });
  });
  (S.tasks||[]).forEach(function(t){
    var d=t.due||t.remind;
    if(!t.done && inR(d)) out.push({kind:"task", date:parseD(d), t:t});
  });
  (S.recurring||[]).forEach(function(r){
    if(inR(r.next)) out.push({kind:"recur", date:parseD(r.next), r:r});
    if(noGhosts || r.freq==="daily" || r.next>toIso) return;
    var g={freq:r.freq, next:r.next, anchor:r.anchor}, n=0, tI=isoD(today());
    while(n++<400){
      advance(g);
      if(g.next>toIso) break;
      if(g.next>=fromIso && g.next>=tI) out.push({kind:"recur", date:parseD(g.next), r:r, ghost:true});
    }
  });
  out.sort(function(a,b){
    if(a.date-b.date) return a.date-b.date;
    if(!!a.ghost!==!!b.ghost) return a.ghost?1:-1;
    return priRank(a)-priRank(b);
  });
  return out;
}
function calWho(i){
  if(i.kind==="step") return i.c.name;
  if(i.kind==="task" && i.t.cid) return caseName(i.t.cid)||"";

}
function calTitle(i){ return i.kind==="step" ? i.s.t : (i.kind==="task" ? i.t.t : i.r.t); }
function laterHTML(flush){

var DONE_DAYS=30, DONE_LOG_MAX=600;
function pruneDone(){
  if(!S) return 0;
  var cut=isoD(addDays(today(),-DONE_DAYS)), n=0;
  if(S.tasks){
    var keepT=S.tasks.filter(function(t){
      if(!t.done) return true;
      if(t.cid && (S.cases||[]).some(function(c){return c.id===t.cid;})) return true;
      return (t.doneAt||t.created||"")>=cut;
    });
    n+=S.tasks.length-keepT.length; S.tasks=keepT;
  }
  if(S.doneLog){
    var keepL=S.doneLog.filter(function(e){ return (e.at||"")>=cut; });
    n+=S.doneLog.length-keepL.length; S.doneLog=keepL;
  }
  if(n) S.donePruned={at:isoD(today()), n:n};
  return n;
}
function logRecur(r, prev){
  if(!S.doneLog) S.doneLog=[];
  S.doneLog.push({id:"d"+uid(), rid:r.id, t:r.t, freq:r.freq, at:isoD(today()), prev:prev, after:r.next});
  if(S.doneLog.length>DONE_LOG_MAX) S.doneLog=S.doneLog.slice(S.doneLog.length-DONE_LOG_MAX);
}
function recurOf(rid){ return (S.recurring||[]).filter(function(x){return x.id===rid;})[0]||null; }
function recurUndoable(e){
  var r=recurOf(e.rid); if(!r || !e.prev) return false;
  var mine=(S.doneLog||[]).filter(function(x){return x.rid===e.rid;});
  return mine[mine.length-1]===e && r.next===e.after;
}
function doneItems(){
  var cut=isoD(addDays(today(),-DONE_DAYS)), out=[];
  function keep(at){ return at && at>=cut; }
  S.cases.forEach(function(c){
    c.steps.forEach(function(st){
      if(!st.done || st.owner==="AUTO" || !keep(st.doneAt)) return;
      out.push({kind:"step", at:st.doneAt||"", t:st.t, c:c, s:st, undo:isActive(c),
        why: c.cancelled ? "checklist cancelled" : (c.archived ? "checklist archived" : "")});
    });
  });
  (S.tasks||[]).forEach(function(t){
    if(!t.done || !keep(t.doneAt)) return;
    out.push({kind:"task", at:t.doneAt||"", t:t.t, task:t, c:(t.cid ? S.cases.filter(function(x){return x.id===t.cid;})[0] : null), undo:true, why:""});
  });
  (S.doneLog||[]).forEach(function(e){
    if(!keep(e.at)) return;
    var r=recurOf(e.rid), u=recurUndoable(e);
    out.push({kind:"recur", at:e.at, t:(r?r.t:e.t), e:e, freq:(r?r.freq:e.freq), undo:u,
      why: u ? "" : (r ? "ticked again since" : "no longer on the list")});
  });
  var i=0; out.forEach(function(x){ x._n=i++; });
  out.sort(function(a,b){
    if(a.at!==b.at) return a.at<b.at ? 1 : -1;
    if(a.kind==="recur" && b.kind==="recur") return b._n-a._n;
    return a._n-b._n;
  });
  return out;
}

var ALARM_DEFAULT_TIME="09:00";
var SNOOZES=[{m:5,l:"5 min"},{m:15,l:"15 min"},{m:30,l:"30 min"},{m:60,l:"1 hour"},{m:1440,l:"Tomorrow"}];

function remindAt(t){
  if(!t || !t.remind) return null;
  var d=parseD(t.remind); if(!d) return null;
  var hm=(t.remindTime||ALARM_DEFAULT_TIME).split(":");
  d.setHours(parseInt(hm[0],10)||0, parseInt(hm[1],10)||0, 0, 0);
  return d;
}
function alarmsDue(){
  var now=new Date();
  return (S.tasks||[]).filter(function(t){
    if(t.done || t.remindDone) return false;
    if(t.snoozeUntil && new Date(t.snoozeUntil)>now) return false;
    var at=remindAt(t);
    return at && at<=now;
  }).sort(function(a,b){ return remindAt(a)-remindAt(b); });
}
function lateness(at){
  var mins=Math.round((new Date()-at)/60000);
  if(mins<2) return "now";
  if(mins<60) return mins+" min ago";
  var h=Math.round(mins/60);
  if(h<24) return h+" hour"+(h>1?"s":"")+" ago";
  var d=Math.round(h/24);
  return d+" day"+(d>1?"s":"")+" ago";
}

var alarmEl=document.getElementById("alarm"), alarmShowing=null;
function renderAlarm(){
  var due=alarmsDue();
  if(!due.length){
    var eodAt=eodDue();
    if(eodAt){
      if(alarmShowing==="__eod" && alarmEl.classList.contains("on")) return;
      alarmShowing="__eod"; alarmEl.innerHTML=eodAlarmHTML(eodAt); alarmEl.classList.add("on"); return;
    }
    alarmEl.classList.remove("on"); alarmEl.innerHTML=""; alarmShowing=null; return;
  }
  var t=due[0];
  if(alarmShowing===t.id && alarmEl.classList.contains("on")) return;
  alarmShowing=t.id;
  var c=t.cid ? S.cases.filter(function(x){return x.id===t.cid;})[0] : null;
  var st=tsteps(t), left=st.length-tsDone(t);
  alarmEl.innerHTML=
    '<div class="alhd"><span class="aldot"></span><span class="alk">Reminder</span>'+
      '<span class="alwhen">'+esc(lateness(remindAt(t)))+'</span></div>'+
    '<div class="albd"><div class="alt">'+esc(t.t)+'</div>'+
      (t.note?'<div class="alsub">'+esc(t.note)+'</div>':'')+
      (c?'<div class="almore">'+esc(c.name)+' \u00b7 '+esc(c.unit)+'</div>':'')+
      (st.length?'<div class="almore">'+(left?left+' of '+st.length+' steps left':'all '+st.length+' steps done')+'</div>':'')+
      (due.length>1?'<div class="almore">and '+(due.length-1)+' more waiting</div>':'')+
    '</div>'+
    '<div class="alft"><button class="alb go" data-act="aldone" data-id="'+esc(t.id)+'">Mark it done</button>'+
      '<button class="alb" data-act="aldismiss" data-id="'+esc(t.id)+'">Dismiss</button>'+
      '<button class="alb" data-act="alopen" data-id="'+esc(t.id)+'">Open it</button>'+
      '<div class="alsz" style="margin-top:9px">Snooze</div>'+
      SNOOZES.map(function(z){
        return '<button class="alb" data-act="alsnooze" data-id="'+esc(t.id)+'" data-m="'+z.m+'">'+esc(z.l)+'</button>';
      }).join("")+
    '</div>';
  alarmEl.classList.add("on");
}
function snoozeTask(id,mins){
  var t=(S.tasks||[]).filter(function(x){return x.id===id;})[0]; if(!t) return;
  var until=new Date();
  if(mins>=1440){ until.setDate(until.getDate()+1); until.setHours(9,0,0,0); }
  else until=new Date(until.getTime()+mins*60000);
  t.snoozeUntil=until.toISOString();
  save(); alarmEl.classList.remove("on"); alarmShowing=null; renderAlarm();
  toast("Snoozed until "+fmtTime(until));
}
function dismissAlarm(id){
  var t=(S.tasks||[]).filter(function(x){return x.id===id;})[0]; if(!t) return;
  t.remindDone=true; t.snoozeUntil=null;

}
function fmtTime(d){
  var h=d.getHours(), m=d.getMinutes();
  return (h<10?"0":"")+h+":"+(m<10?"0":"")+m;
}

modalEl.addEventListener("click",function(e){
  var sm=e.target.closest('[data-act="tsmove"]');
  if(sm){
    var row=sm.closest(".tsrow"), dir=parseInt(sm.dataset.dir,10);
    if(dir<0 && row.previousElementSibling) row.parentNode.insertBefore(row, row.previousElementSibling);
    if(dir>0 && row.nextElementSibling) row.parentNode.insertBefore(row.nextElementSibling, row);
    tsRefresh();
    var again=row.querySelectorAll('[data-act="tsmove"]')[dir<0?0:1];
    if(again && !again.disabled) again.focus();
    return;
  }
  var sx=e.target.closest('[data-act="tsdel"]');
  if(sx){ sx.closest(".tsrow").remove(); tsRefresh(); return; }
  var sa=e.target.closest('[data-act="tsadd"]');

    var box=document.getElementById("tsed"); if(!box) return;

  var c=e.target.closest(".chip"); if(!c) return;
  var name=c.dataset.chip;

  } else {

      '<textarea id="fQ" style="min-height:64px" placeholder="One per line, for example:&#10;Travelling abroad&#10;First time doing this">'+esc((f.flags||[]).map(function(x){return x.label;}).join("\n"))+'</textarea>'+
      '<div class="hint">Optional. Each line becomes a switch on the New checklist form, and any step can be set to appear only when a switch is on. Leave empty if every checklist of this goal has the same steps.</div></div>'+
    '<div class="hint">Once it exists, add its steps in the Step library — it gets its own section there.</div>';
  openModal(isNew?"New goal":"Edit goal", isNew?"":esc(f.label), body, function(){
    var label=mv("fL").trim(); if(!label){ toast("Give the goal a name"); return false; }
    var asks=readChips("pasks"); if(asks==="*") asks=[];
    var oldFlags=(existing && existing.flags)||[], newFlags=[];
    mv("fQ").split("\n").forEach(function(line){
      var lab=line.trim(); if(!lab) return;
      if(newFlags.some(function(x){return x.label===lab;})) return;
      var was=oldFlags.filter(function(x){return x.label===lab;})[0];
      newFlags.push({k: was?was.k:("q_"+uid()), label:lab});
    });
    var goneKeys=oldFlags.filter(function(o){ return !newFlags.some(function(n){return n.k===o.k;}); }).map(function(o){return o.k;});
    if(goneKeys.length && existing){
      S.template.forEach(function(st){
        if(stepProcess(st)===existing.id && st.when && st.when.length)
          st.when=st.when.filter(function(k){return goneKeys.indexOf(k)===-1;});
      });
    }
    var made=makeProcess({
      id: existing?existing.id:null,
      flags: newFlags,
      label: label,
      anchorLabel: mv("fA").trim()||"Date",
      subjectLabel: mv("fS").trim()||"Name",
      anchorAhead: Math.abs(parseInt(mv("fD"),10)||0),
      asksInst: asks.indexOf("inst")!==-1,
      asksUnit: asks.indexOf("unit")!==-1
    });
    if(existing){ S.processes[S.processes.indexOf(existing)]=made; }
    else { S.processes.push(made); if(S.seededProcesses.indexOf(made.id)===-1) S.seededProcesses.push(made.id); }
    rebuildProcesses(); save(); render();
    toast(isNew?"Goal created — add its steps in the Step library":"Goal updated");
    return true;
  });
}

function procDel(id){
  var pr=S.processes.filter(function(x){return x.id===id;})[0]; if(!pr) return;
  var used=S.cases.filter(function(c){return caseProcess(c)===id;});
  if(used.length){
    alert("“"+pr.label+"” still has "+used.length+" checklist"+(used.length>1?"s":"")+
      ". Archive or delete "+(used.length>1?"them":"it")+" first — deleting the goal would leave "+
      (used.length>1?"them":"it")+" with nothing to render.");
    return;
  }
  var steps=S.template.filter(function(x){return stepProcess(x)===id;}).length;
  if(!confirm("Delete “"+pr.label+"”"+(steps?" and its "+steps+" step"+(steps>1?"s":""):"")+"?")) return;
  S.processes=S.processes.filter(function(x){return x.id!==id;});
  S.template=S.template.filter(function(x){return stepProcess(x)!==id;});
  S.seededProcesses=S.seededProcesses.filter(function(x){return x!==id;});
  rebuildProcesses(); save(); render(); toast("Goal deleted");
}
